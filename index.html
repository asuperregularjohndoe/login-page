<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CompanyName</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .card { max-width: 420px; margin: 80px auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div style="font-size:28px;font-weight:700;color:#0d6efd;">CompanyName</div>
                <small class="text-muted">Secure Portal</small>
            </div>
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Email or username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your email" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
            </form>
            <div class="text-center mt-4 small text-muted">Need help? Contact IT Support</div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
